[package]
name = "lyra"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rodio = "0.19"
anyhow = "1.0"
id3 = "1.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
mpris-server = { version = "0.10", features = ["tokio"] }
tokio = { version = "1.53.2", features = ["rt"] }
