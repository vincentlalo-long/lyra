name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: MusicPlayer

      # A tag must describe exactly the version in Cargo.toml; otherwise the
      # updater would advertise a version the binary does not report.
      - name: Verify tag matches Cargo version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' MusicPlayer/Cargo.toml | head -1)
          tag_version="${TAG#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Tag $TAG does not match MusicPlayer/Cargo.toml version $cargo_version"
            exit 1
          fi

      - name: Run test suite before publishing
        run: |
          cargo test --manifest-path MusicPlayer/Cargo.toml --locked
          cargo test --manifest-path MusicPlayer/Cargo.toml --locked --no-default-features

      - name: Build Full TUI Binary
        run: |
          cargo build --manifest-path MusicPlayer/Cargo.toml --release --locked
          strip MusicPlayer/target/release/lyra
          tar -czvf lyra-linux-x86_64.tar.gz -C MusicPlayer/target/release lyra

      - name: Build Minimal TUI Binary
        run: |
          cargo build --manifest-path MusicPlayer/Cargo.toml --release --locked --no-default-features
          strip MusicPlayer/target/release/lyra
          tar -czvf lyra-minimal-linux-x86_64.tar.gz -C MusicPlayer/target/release lyra

      - name: Package CLI Only
        run: |
          tar --exclude='*__pycache__*' -czvf lyra-cli.tar.gz lyra main.py requirements.txt

      - name: Generate update manifest & checksums
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          sha256sum lyra-linux-x86_64.tar.gz lyra-minimal-linux-x86_64.tar.gz lyra-cli.tar.gz > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          files = [
              "lyra-linux-x86_64.tar.gz",
              "lyra-minimal-linux-x86_64.tar.gz",
              "lyra-cli.tar.gz",
          ]
          assets = []
          for name in files:
              digest = hashlib.sha256(open(name, "rb").read()).hexdigest()
              assets.append({
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": digest,
              })
          manifest = {
              "version": tag[1:] if tag.startswith("v") else tag,
              "tag": tag,
              "notes": f"Lyra {tag}",
              "assets": assets,
          }
          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          PY

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            lyra-linux-x86_64.tar.gz
            lyra-minimal-linux-x86_64.tar.gz
            lyra-cli.tar.gz
            SHA256SUMS
            latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
