name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: MusicPlayer

      - name: Build Full TUI Binary
        run: |
          cargo build --manifest-path MusicPlayer/Cargo.toml --release
          strip MusicPlayer/target/release/lyra
          tar -czvf lyra-linux-x86_64.tar.gz -C MusicPlayer/target/release lyra

      - name: Build Minimal TUI Binary
        run: |
          cargo build --manifest-path MusicPlayer/Cargo.toml --release --no-default-features
          strip MusicPlayer/target/release/lyra
          tar -czvf lyra-minimal-linux-x86_64.tar.gz -C MusicPlayer/target/release lyra

      - name: Package CLI Only
        run: |
          tar --exclude='*__pycache__*' -czvf lyra-cli.tar.gz lyra main.py requirements.txt

      - name: Generate update manifest & checksums
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          sha256sum lyra-linux-x86_64.tar.gz lyra-minimal-linux-x86_64.tar.gz lyra-cli.tar.gz > SHA256SUMS
          python3 - <<'PY'
          import hashlib, json, os
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          files = [
              "lyra-linux-x86_64.tar.gz",
              "lyra-minimal-linux-x86_64.tar.gz",
              "lyra-cli.tar.gz",
          ]
          assets = []
          for name in files:
              digest = hashlib.sha256(open(name, "rb").read()).hexdigest()
              assets.append({
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": digest,
              })
          manifest = {
              "version": tag[1:] if tag.startswith("v") else tag,
              "tag": tag,
              "notes": f"Lyra {tag}",
              "assets": assets,
          }
          with open("latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          PY

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lyra-linux-x86_64.tar.gz
            lyra-minimal-linux-x86_64.tar.gz
            lyra-cli.tar.gz
            SHA256SUMS
            latest.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
