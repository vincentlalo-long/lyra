name: Bug report
description: Report a reproducible problem with the player, downloader, or CLI
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please search existing issues first, and never paste
        Spotify credentials, tokens, or private paths.

  - type: input
    id: version
    attributes:
      label: Lyra version
      description: Output of `lyra --version`
      placeholder: "lyra 0.3.4"
    validations:
      required: true

  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Full TUI (release tarball)
        - Minimal TUI (release tarball)
        - CLI only (main.py)
        - Built from source
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, and audio backend (ALSA / PulseAudio / PipeWire)
      placeholder: "Fedora 44, Kitty, PipeWire"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact keys or commands, in order
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Terminal output, panic messages, or a recording
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem
          required: true
        - label: I am running the latest release, or explained why I cannot
          required: true
